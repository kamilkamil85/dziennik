<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Dziennik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600&family=Quicksand:wght@500;700&family=Patrick+Hand&family=Playfair+Display:ital,wght@1,500&family=Bebas+Neue&family=Inter:wght@500;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <nav id="kids" class="kids" aria-label="Dzieci"></nav>
  <button id="theme" class="icon-btn" aria-label="Zmień wygląd" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg>
  </button>
  <button id="refresh" class="icon-btn" aria-label="Odśwież">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Ekrany">
  <button data-tab="today" class="on"><span class="ti">☀</span>Dziś</button>
  <button data-tab="grades"><span class="ti txt">5+</span>Oceny</button>
  <button data-tab="agenda"><span class="ti">▦</span>Terminarz</button>
  <button data-tab="messages"><span class="ti">✉</span>Wiadomości</button>
</nav>

<dialog id="sheet"><div id="sheet-body"></div><form method="dialog"><button class="btn">Zamknij</button></form></dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
