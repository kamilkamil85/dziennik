<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1">
<script>
// Tablety często mają ~960 px szerokości (w px CSS). Układamy jak na 1280 px i pomniejszamy.
(function () {
  var w = Math.max(screen.width, screen.height);
  if (w < 1280) document.getElementById("vp").setAttribute("content", "width=1280");
})();
</script>
<title>Tablica</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #ffffff; --ink: #161716; --muted: #4f534f; --soft: #767a76; --line: #ececea; --accent: #2f6fdf;
  --good: #2e9a5e; --mid: #d19a1c; --bad: #d0493a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: 34px 44px 26px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-row-gap: 26px; overflow: hidden; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }

/* góra: zegar | pogoda */
.top { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-column-gap: 40px; align-items: end; }
.clock { font-size: 112px; font-weight: 400; line-height: .82; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.date { font-size: 24px; color: var(--muted); margin-top: 14px; }
.date::first-letter { text-transform: uppercase; }
.commute { margin-top: 8px; font-size: 18px; color: var(--muted); }
.commute b { color: var(--ink); font-weight: 600; }
.wx { display: grid; grid-template-columns: auto repeat(3, auto) auto; grid-column-gap: 22px; align-items: end; justify-content: end; min-width: 0; }
.now { display: flex; align-items: center; }
.now .ico { font-size: 54px; color: var(--ink); margin-right: 16px; line-height: 1; }
.now .t { font-size: 72px; font-weight: 400; line-height: .85; letter-spacing: -.03em; }
.now .d { font-size: 16px; color: var(--muted); margin-top: 8px; max-width: 150px; line-height: 1.3; }
.fd .n, .air .n { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 500; }
.fd .v { font-size: 24px; font-weight: 400; margin-top: 6px; white-space: nowrap; }
.fd .v .ico { color: var(--muted); margin-right: 8px; }
.fd .p, .air .p { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.air { padding-left: 22px; border-left: 1px solid var(--line); }
.air .v { font-size: 24px; margin-top: 6px; white-space: nowrap; }
.air .v .dot { margin-right: 8px; vertical-align: 3px; }
.warn { grid-column: 1 / -1; justify-self: end; color: var(--bad); font-size: 16px; font-weight: 600; margin-top: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }

.patron { font-size: 17px; line-height: 1.45; color: var(--muted); max-width: 1100px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.patron b { color: var(--ink); font-weight: 600; }
.patron:empty { display: none; }
.patron .cov, .cov-tag { color: var(--accent); }
.cov-tag { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }

/* tydzień: bez kart, tylko cienkie linie */
.week { grid-row: 3; display: grid; grid-template-columns: 1.6fr repeat(6, minmax(0, 1fr)); min-height: 0; border-top: 1px solid var(--line); }
.day { padding: 18px 16px 0; border-left: 1px solid var(--line); overflow: hidden; min-width: 0; color: var(--ink); }
.day:first-child { border-left: 0; padding-left: 0; padding-right: 26px; }
.day.past { opacity: .45; }
.day > * + * { margin-top: 12px; }
.dh b { display: block; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
.dh span { display: block; font-size: 13px; color: var(--soft); margin-top: 3px; }
.day.focus .dh b { color: var(--ink); font-weight: 700; }
.day.focus .dh::after { content: ""; display: block; width: 22px; height: 3px; background: var(--accent); margin-top: 8px; border-radius: 2px; }
.kr { display: flex; align-items: flex-start; font-size: 18px; line-height: 1.35; }
.chips { display: flex; flex: none; margin: 7px 10px 0 0; }
.chip { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--bg); }
.chip + .chip { margin-left: -2px; }
.kr .nm { font-size: 14px; color: var(--soft); }
.kr .s { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kr .x { font-size: 16px; color: var(--muted); }
.kr .nt { color: var(--bad); font-size: 13px; }
.ev { font-size: 17px; line-height: 1.35; color: var(--ink); padding-left: 18px; position: relative; }
.ev::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 2px; border-radius: 1px; background: var(--c); }
.ev .h { display: block; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.sep { height: 0; }
/* dziś: większe, czarne */
.big { color: var(--ink); }
.big .dh b { font-size: 34px; font-weight: 600; letter-spacing: -.01em; text-transform: none; }
.big .dh span { display: none; }
.big .kr { font-size: 22px; }
.big .chips { margin: 9px 14px 0 0; }
.big .chip { width: 11px; height: 11px; }
.big .kr .x { font-size: 17px; color: var(--muted); }
.big .kr .nm { font-size: 15px; }
.big .ev { font-size: 20px; padding-left: 20px; }
.big .ev .h { font-size: 15px; }
.stamp { position: fixed; right: 44px; bottom: 10px; font-size: 12px; color: var(--soft); }

/* noc */
body.night { --bg: #000; --ink: #8b8b86; --muted: #55554f; grid-template-rows: 1fr; place-items: center; }
body.night .week, body.night .patron, body.night .warn, body.night .air, body.night .commute, body.night .stamp, body.night .fd { display: none; }
body.night .top { grid-template-columns: 1fr; justify-items: center; grid-row-gap: 40px; }
body.night .time { text-align: center; }
body.night .clock { font-size: 200px; font-weight: 200; }
body.night .wx { justify-self: center; grid-template-columns: auto; }
body.night .now .ico { color: var(--muted); }

.lock { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 22px; z-index: 9; }
.lock > * { margin: 8px 0; }
.lock input { font-size: 24px; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--line); width: 360px; }
.lock button { font-size: 22px; padding: 12px 28px; border-radius: 12px; border: 0; background: var(--ink); color: #fff; }
.small { font-size: 15px; color: var(--muted); }

/* minutnik */
.tbtn { position: fixed; left: 44px; bottom: 14px; font: inherit; font-size: 17px; font-weight: 600; color: var(--ink); background: #f1f1ef; border: 0; border-radius: 999px; padding: 10px 20px; z-index: 5; }
.tbtn.run { background: var(--accent); color: #fff; font-variant-numeric: tabular-nums; }
.tbtn.ring { background: var(--bad); color: #fff; }
body.night .tbtn:not(.run):not(.ring) { display: none; }
.tm { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 8; padding: 36px 48px; display: flex; flex-direction: column; color: var(--ink); }
.tm-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.tm-head h2 { margin: 0; font-size: 34px; font-weight: 600; }
.tm button { font: inherit; border: 0; border-radius: 16px; background: #f1f1ef; color: var(--ink); }
.tm .x { font-size: 20px; padding: 12px 22px; }
.tm .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 16px; }
.tm .tile { font-size: 26px; font-weight: 600; padding: 30px 20px; text-align: left; }
.tm .tile small { display: block; font-size: 16px; font-weight: 400; color: var(--muted); margin-top: 6px; }
.tm .label { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 30px 0 12px; }
.tm .row { display: flex; flex-wrap: wrap; align-items: center; }
.tm .row > * { margin: 0 12px 12px 0; }
.tm .min { font-size: 24px; font-weight: 600; padding: 18px 26px; min-width: 90px; }
.tm .val { font-size: 56px; font-weight: 600; min-width: 170px; text-align: center; font-variant-numeric: tabular-nums; }
.tm .go { background: var(--accent); color: #fff; font-size: 26px; font-weight: 600; padding: 20px 44px; }
.tm .steps { font-size: 24px; line-height: 1.45; margin: 0; padding-left: 34px; max-width: 900px; }
.tm .steps li { margin-bottom: 12px; }
.tm .plan { font-size: 20px; color: var(--muted); margin: 18px 0 26px; }
.tm .big-t { font-size: 200px; font-weight: 500; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; text-align: center; margin-top: 10px; }
.tm .stage { font-size: 30px; text-align: center; font-weight: 600; }
.tm .next { font-size: 20px; text-align: center; color: var(--muted); margin-top: 10px; }
.tm .center { display: flex; justify-content: center; margin-top: 34px; }
.tm .center > * { margin: 0 8px; }
.tm.ring { background: #fde9e6; }
.tm.ring .big-t { color: var(--bad); }
</style>
</head>
<body>
<section class="top">
  <div class="time"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><div class="commute" id="commute"></div></div>
  <div class="wx" id="wx"></div>
</section>
<section class="patron" id="patron"></section>
<section class="week" id="week"></section>
<div class="stamp" id="stamp"></div>
<button class="tbtn" id="tbtn">Minutnik</button>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["niedziela", "poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota"];
const DSHORT = ["nd", "pn", "wt", "śr", "cz", "pt", "sb"];
const MONTHS = ["stycznia", "lutego", "marca", "kwietnia", "maja", "czerwca", "lipca", "sierpnia", "września", "października", "listopada", "grudnia"];
const COLORS = { legia: "#1f9a55", fiolet: "#7b3fe4", magia: "#e0559a" };
const PLACE = { lat: 52.0874, lon: 21.2492, teryt: "1417" };
const TOMORROW_FROM = 17, NIGHT_FROM = 22, NIGHT_TO = 6;
let board = null, weather = null, warns = [], imgw = null;
// ?czas=RRRR-MM-DDTHH:MM symuluje inną godzinę (do testów wyglądu).
const FAKE = new URLSearchParams(location.search).get("czas"), T0 = Date.now();
const clock = () => FAKE ? new Date(new Date(FAKE).getTime() + (Date.now() - T0)) : new Date();

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

async function fetchBox() {
  const r = await fetch(`../data/board.json?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error("brak danych");
  return r.json();
}
async function decrypt(raw, box) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(box.iv) }, key, b64d(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function derive(pw, box) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(box.salt), iterations: box.iter }, base, 256);
}
function askPassword() {
  if ($(".lock")) return;
  const d = document.createElement("div");
  d.className = "lock";
  d.innerHTML = `<div>Hasło tablicy</div><input type="password" id="pw" autocomplete="current-password"><label class="small"><input type="checkbox" id="show" style="width:auto"> pokaż hasło</label><button id="go">Otwórz</button><div id="err" class="small"></div>`;
  document.body.appendChild(d);
  const go = async () => {
    try {
      const box = await fetchBox(), raw = await derive($("#pw").value, box);
      board = await decrypt(raw, box);
      store("boardKey", b64e(raw)); d.remove(); render();
    } catch { $("#err").textContent = "Złe hasło albo brak danych."; }
  };
  $("#show").onchange = (e) => { $("#pw").type = e.target.checked ? "text" : "password"; $("#pw").focus(); };
  $("#go").onclick = go; $("#pw").onkeydown = (e) => e.key === "Enter" && go();
}
async function loadBoard() {
  const raw = store("boardKey");
  if (!raw) return askPassword();
  try { board = await decrypt(b64d(raw), await fetchBox()); render(); }
  catch (e) { if (String(e).includes("OperationError")) { try { localStorage.removeItem("boardKey"); } catch {} askPassword(); } }
}

// ---------- pogoda i powietrze ----------
const SVG = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  part: '<path d="M8 3.5v1.6M3.3 8.5h1.6M4.6 5.1l1.1 1.1M11.4 5.1l-1.1 1.1"/><path d="M5.6 10.6a3 3 0 1 1 5-3"/><path d="M8 20h9.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 8 20z"/>',
  cloud: '<path d="M7 19h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.4A3.4 3.4 0 0 0 7 19z"/>',
  fog: '<path d="M7 13.5h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.4"/><path d="M4 17h16M6 20.5h12"/>',
  rain: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.4A3.4 3.4 0 0 0 7 15z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  snow: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.4A3.4 3.4 0 0 0 7 15z"/><path d="M8 19h.01M12 18h.01M16 19h.01M10 21.5h.01M14 21.5h.01" stroke-width="2.4"/>',
  storm: '<path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.4A3.4 3.4 0 0 0 7 15z"/><path d="M12.5 15.5l-2 3.5h3l-2 3.5"/>',
};
const icon = (k) => k ? `<svg class="i" viewBox="0 0 24 24">${SVG[k]}</svg>` : "";
const WMO = { 0: ["sun", "bezchmurnie"], 1: ["part", "pogodnie"], 2: ["part", "zachmurzenie"], 3: ["cloud", "pochmurno"],
  45: ["fog", "mgła"], 48: ["fog", "szadź"], 51: ["rain", "mżawka"], 53: ["rain", "mżawka"], 55: ["rain", "mżawka"],
  56: ["rain", "marznąca mżawka"], 57: ["rain", "marznąca mżawka"], 61: ["rain", "słaby deszcz"], 63: ["rain", "deszcz"], 65: ["rain", "ulewa"],
  66: ["rain", "marznący deszcz"], 67: ["rain", "marznący deszcz"], 71: ["snow", "słaby śnieg"], 73: ["snow", "śnieg"], 75: ["snow", "dużo śniegu"],
  77: ["snow", "śnieg"], 80: ["rain", "przelotny deszcz"], 81: ["rain", "przelotny deszcz"], 82: ["storm", "ulewa"],
  85: ["snow", "przelotny śnieg"], 86: ["snow", "przelotny śnieg"], 95: ["storm", "burza"], 96: ["storm", "burza z gradem"], 99: ["storm", "burza z gradem"] };
const AIR = { 1: ["bardzo dobre", "var(--good)"], 2: ["dobre", "var(--good)"], 3: ["umiarkowane", "var(--mid)"], 4: ["dostateczne", "var(--mid)"], 5: ["złe", "var(--bad)"], 6: ["bardzo złe", "var(--bad)"] };

async function loadWeather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${PLACE.lat}&longitude=${PLACE.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Europe%2FWarsaw&forecast_days=4`;
    weather = await (await fetch(u)).json();
  } catch {}
  try { imgw = await (await fetch("https://danepubliczne.imgw.pl/api/data/synop/station/warszawa")).json(); } catch {}
  renderWx();
}
async function loadWarnings() {
  try {
    const list = await (await fetch("https://danepubliczne.imgw.pl/api/data/warningsmeteo")).json(), now = clock();
    warns = list.filter((w) => (w.teryt || []).includes(PLACE.teryt) && new Date(w.obowiazuje_do.replace(" ", "T")) > now);
  } catch { warns = []; }
  renderWx();
}
function renderWx() {
  let h = "";
  if (weather?.daily) {
    const d = weather.daily, cur = weather.current;
    const t = imgw?.temperatura != null ? Math.round(parseFloat(imgw.temperatura)) : Math.round(cur.temperature_2m);
    const [ico, txt] = WMO[cur.weather_code] || ["", ""];
    h += `<div class="now"><span class="ico">${icon(ico)}</span><div><div class="t">${t}°</div>
      <div class="d">${esc(txt)} · dziś ${Math.round(d.temperature_2m_min[0])}°/${Math.round(d.temperature_2m_max[0])}°</div></div></div>`;
    for (let i = 1; i <= 3; i++) {
      const dt = new Date(d.time[i] + "T12:00:00"), [fi] = WMO[d.weather_code[i]] || [""];
      const p = d.precipitation_probability_max[i];
      h += `<div class="fd"><div class="n">${i === 1 ? "jutro" : DAYS[dt.getDay()]}</div>
        <div class="v"><span class="ico">${icon(fi)}</span>${Math.round(d.temperature_2m_min[i])}° / ${Math.round(d.temperature_2m_max[i])}°</div>
        <div class="p">${p >= 30 ? `opady ${p}%` : "&nbsp;"}</div></div>`;
    }
  }
  const s = board?.smog;
  if (s && s.index) {
    const [lab, col] = AIR[s.index] || ["?", "var(--muted)"];
    h += `<div class="air"><div class="n">powietrze</div><div class="v"><span class="dot" style="background:${col}"></span>${lab}</div>
      <div class="p">PM2,5 ${esc(s.pm25)} · PM10 ${esc(s.pm10)}</div></div>`;
  }
  h += warns.slice(0, 2).map((w) => `<div class="warn">${esc(w.nazwa_zdarzenia)} (stopień ${esc(w.stopien)}) · ${esc(w.obowiazuje_od.slice(11, 16))}–${esc(w.obowiazuje_do.slice(11, 16))}${w.obowiazuje_do.slice(0, 10) !== iso(clock()) ? " (do jutra)" : ""}</div>`).join("");
  $("#wx").innerHTML = h;
}

// ---------- tydzień ----------
function activitiesFor(name, date) {
  const dow = (date.getDay() + 6) % 7, day = iso(date);
  return (board.activities || []).filter((a) => a.kto === name && !(a.bez || []).includes(day) && (a.data ? a.data === day : a.dni.includes(dow)))
    .sort((a, b) => a.od.localeCompare(b.od, undefined, { numeric: true }));
}
function renderWeek() {
  if (!board) return;
  const now = clock(), evening = now.getHours() >= TOMORROW_FROM;
  let h = "";
  for (let i = 0; i < 7; i++) {
    const date = addDays(now, i), d = iso(date), weekend = date.getDay() === 0 || date.getDay() === 6;
    const title = i === 0 ? "Dziś" : i === 1 ? "Jutro" : DAYS[date.getDay()];
    const cls = ["day", i === 0 ? "big" : "", weekend ? "weekend" : "", (evening ? i === 1 : i === 0) ? "focus" : "", evening && i === 0 ? "past" : ""].join(" ");
    let body = "";
    // wiersze: lekcje i zajęcia; te same godziny / te same zajęcia kilku dzieci pokazujemy raz
    const rows = new Map(), add = (key, sort, html, k) => {
      if (!rows.has(key)) rows.set(key, { sort, html, kids: [] });
      rows.get(key).kids.push(k);
    };
    for (const k of board.kids) {
      const sd = (k.days || []).find((x) => x.date === d);
      if (sd?.start) {
        const notes = (sd.notes || []).map((n) => `<div class="nt">${esc(n)}</div>`).join("");
        add(`s|${sd.start}|${sd.end}|${notes}`, "0" + sd.start.padStart(5, "0"), `<span class="s">${esc(sd.start)}–${esc(sd.end)}</span>${notes}`, k);
      }
      for (const a of activitiesFor(k.name, date))
        add(`a|${a.co}|${a.od}|${a.do}`, "1" + a.od.padStart(5, "0"), `<span class="x">${esc(a.co)} ${esc(a.od)}${a.do && i === 0 ? "–" + esc(a.do) : ""}</span>`, k);
    }
    let prev = "";
    for (const r of [...rows.values()].sort((a, b) => a.sort.localeCompare(b.sort))) {
      const names = r.kids.map((k) => esc(k.name)).join(", ");
      if (names === prev) { body = body.replace(/<\/div><\/div>$/, `<br>${r.html}</div></div>`); continue; } // te same dzieci pod rząd: bez powtarzania imienia
      prev = names;
      const dots = r.kids.map((k) => `<span class="chip" style="--c:${COLORS[k.theme] || "#555"}"></span>`).join("");
      body += `<div class="kr"><span class="chips">${dots}</span><div><div class="nm">${names}</div>${r.html}</div></div>`;
    }
    const evs = (board.events || []).filter((e) => e.date === d);
    if (evs.length && body) body += `<div class="sep"></div>`;
    body += evs.map((e) => `<div class="ev" style="--c:${esc(e.color || "#888")}">${e.allDay ? "" : `<span class="h">${esc(e.from)}${e.to && i === 0 ? "–" + esc(e.to) : ""}</span> `}${esc(e.title)}</div>`).join("");
    if (date.getDate() === 18 && i > 0) body = `<div class="cov-tag">Dzień Przymierza</div>` + body;
    if (!body) body = `<div class="small">${weekend ? "wolne" : "—"}</div>`;
    h += `<div class="${cls}"><div class="dh"><b>${title}</b><span>${i === 1 ? DSHORT[date.getDay()] + " " : ""}${date.getDate()}.${String(date.getMonth() + 1).padStart(2, "0")}</span></div>${body}</div>`;
  }
  $("#week").innerHTML = h;
}
function renderCommute() {
  const c = board?.commute, now = clock(), hr = now.getHours() + now.getMinutes() / 60;
  if (!c || hr < 6.75 || hr > 9.25) { $("#commute").innerHTML = ""; return; }
  const col = c.delay >= 10 ? "var(--bad)" : c.delay >= 5 ? "var(--mid)" : "var(--good)";
  $("#commute").innerHTML = `<span class="dot" style="background:${col};margin-right:8px"></span>do pracy <b>${c.minutes} min</b>${c.delay > 0 ? ` <span class="small">(+${c.delay} korki)</span>` : ""} <span class="small">· ${esc(c.at)}</span>`;
}
function renderPatron() {
  const p = board?.patron;
  // patron jest liczony przy przebiegu; po północy, zanim przyjdą nowe dane, nie pokazujemy wczorajszego
  const fresh = board && board.generated.slice(0, 10) === iso(clock());
  const covenant = clock().getDate() === 18 ? `<b class="cov">Dziś Dzień Przymierza.</b> ` : "";
  $("#patron").innerHTML = covenant + (!fresh ? "" : p ? `<b>Patron dnia: ${esc(p.name)}.</b> ${esc(p.text)}` : `<b>Patron dnia:</b> nie pobrano danych na ten dzień.`);
}
function render() {
  renderPatron(); renderWeek(); renderCommute(); renderWx();
  if (board) $("#stamp").textContent = `dane z ${board.generated.slice(11)}`;
}

function tick() {
  const now = clock(), hh = now.getHours();
  $("#clock").textContent = `${hh}:${String(now.getMinutes()).padStart(2, "0")}`;
  $("#date").textContent = `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}`;
  document.body.classList.toggle("night", hh >= NIGHT_FROM || hh < NIGHT_TO);
  if (now.getSeconds() === 0) render();
  if (hh === 3 && now.getMinutes() === 0 && now.getSeconds() === 0) location.reload(); // nowa wersja strony raz na dobę
}


// ---------- minutnik ----------
// Ilości wody i czasy to typowe wartości z opakowań; zmień tutaj, jeśli u was wychodzi inaczej.
const DISHES = [
  { name: "Ryż basmati", note: "na sypko", water: { 100: 150, 200: 300 }, cook: { 100: 10, 200: 12 }, rest: 10,
    steps: (g, w) => [`Wsyp ${g} g ryżu do sitka i płucz pod zimną wodą, aż woda będzie przezroczysta.`,
      `Zagotuj w garnku ${w} ml wody z małą szczyptą soli.`, "Wsyp ryż do wrzątku, zamieszaj raz, przykryj pokrywką.",
      "Zmniejsz gaz na najmniejszy i naciśnij Start. Nie podnoś pokrywki."] },
  { name: "Kasza gryczana", note: "palona", water: { 100: 200, 200: 400 }, cook: { 100: 15, 200: 15 }, rest: 10,
    steps: (g, w) => [`Przepłucz ${g} g kaszy na sitku.`, `Zagotuj ${w} ml wody z solą (i łyżeczką oleju, żeby kasza się nie kleiła).`,
      "Wsyp kaszę do wrzątku, przykryj pokrywką.", "Zmniejsz gaz na najmniejszy i naciśnij Start. Nie mieszaj."] },
  { name: "Kasza jęczmienna", note: "perłowa", water: { 100: 250, 200: 500 }, cook: { 100: 20, 200: 22 }, rest: 10,
    steps: (g, w) => [`Przepłucz ${g} g kaszy na sitku, aż woda będzie czysta.`, `Zagotuj ${w} ml wody z solą.`,
      "Wsyp kaszę do wrzątku, zamieszaj, przykryj pokrywką.", "Zmniejsz gaz na mały i naciśnij Start."] },
];
let T = null; // { stages: [{name, min}], i, end, ringing, title }
let audio = null, beepTimer = null;
const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach((d) => { const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.5, audio.currentTime + d); g.gain.setValueAtTime(0, audio.currentTime + d + .22);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .25); });
  } catch {}
}
function stopRing() { clearInterval(beepTimer); beepTimer = null; if (T) T.ringing = false; }
function tmClose() { const m = $(".tm"); if (m) m.remove(); }
function tmOpen(html) {
  tmClose();
  const d = document.createElement("div"); d.className = "tm"; d.innerHTML = html; document.body.appendChild(d);
  d.addEventListener("click", (e) => { const b = e.target.closest("[data-a]"); if (b) tmAction(b.dataset.a, b.dataset.v); });
  return d;
}
const head = (title, back) => `<div class="tm-head"><h2>${title}</h2><div>${back ? `<button class="x" data-a="${back}">Wstecz</button> ` : ""}<button class="x" data-a="close">Zamknij</button></div></div>`;
let freeMin = 5;
function tmMenu() {
  if (T) return tmRun();
  tmOpen(head("Minutnik") + `<div class="grid">${DISHES.map((d, i) => `<button class="tile" data-a="dish" data-v="${i}">${d.name}<small>${d.note}</small></button>`).join("")}</div>
    <div class="label">Dowolny czas</div>
    <div class="row"><button class="min" data-a="dec">−1</button><div class="val" id="fm">${freeMin} min</div><button class="min" data-a="inc">+1</button>
      ${[3, 5, 10, 15, 20, 30, 40].map((m) => `<button class="min" data-a="set" data-v="${m}">${m}</button>`).join("")}
      <button class="go" data-a="free">Start</button></div>`);
}
function tmDish(i) {
  const d = DISHES[i];
  tmOpen(head(d.name, "menu") + `<div class="label">Ile?</div><div class="row">${[100, 200].map((g) => `<button class="tile" data-a="grams" data-v="${i}:${g}">${g} g<small>${d.water[g]} ml wody</small></button>`).join("")}</div>`);
}
function tmRecipe(i, g) {
  const d = DISHES[i], w = d.water[g], c = d.cook[g];
  tmOpen(head(`${d.name}, ${g} g`, "back:" + i) + `<ol class="steps">${d.steps(g, w).map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
    <div class="plan">Potem: ${c} min gotowania na małym gazie, a po sygnale wyłącz gaz i zostaw pod pokrywką na ${d.rest} min.</div>
    <div><button class="go" data-a="start" data-v="${i}:${g}">Start: ${c} min gotowania</button></div>`);
}
function tmStart(title, stages) {
  stopRing(); beep(); // pierwszy dźwięk po dotknięciu odblokowuje audio w przeglądarce
  T = { title, stages, i: 0, end: Date.now() + stages[0].min * 60e3, ringing: false };
  tmRun();
}
function tmRun() {
  if (!T) return tmMenu();
  const st = T.stages[T.i], nx = T.stages[T.i + 1];
  const m = tmOpen(head(T.title) + `<div class="stage" id="tst"></div><div class="big-t" id="tt"></div><div class="next" id="tnx"></div><div class="center" id="tbt"></div>`);
  tmUpdate();
}
function tmUpdate() {
  const btn = $("#tbtn");
  if (!T) { btn.className = "tbtn"; btn.textContent = "Minutnik"; return; }
  const st = T.stages[T.i], nx = T.stages[T.i + 1], left = T.end - Date.now();
  if (left <= 0 && !T.ringing) { T.ringing = true; beep(); beepTimer = setInterval(beep, 2500); if (!$(".tm")) tmRun(); }
  btn.className = "tbtn " + (T.ringing ? "ring" : "run");
  btn.textContent = T.ringing ? "Minutnik: koniec!" : `${st.name} ${fmt(left)}`;
  const m = $(".tm"); if (!m || !$("#tt")) return;
  m.classList.toggle("ring", T.ringing);
  $("#tt").textContent = T.ringing ? "0:00" : fmt(left);
  $("#tst").textContent = T.ringing ? (nx ? st.done : "Gotowe!") : st.name;
  $("#tnx").textContent = !T.ringing && nx ? `potem: ${nx.name.toLowerCase()} ${nx.min} min` : "";
  const want = T.ringing ? (nx ? `<button class="go" data-a="next">${esc(st.go)}</button>` : `<button class="go" data-a="done">OK</button>`)
    : `<button class="x" data-a="plus">+1 min</button><button class="x" data-a="cancel">Anuluj</button>`;
  if ($("#tbt").dataset.k !== want) { $("#tbt").innerHTML = want; $("#tbt").dataset.k = want; }
}
function tmAction(a, v) {
  if (a === "close") return tmClose();
  if (a === "menu") return tmMenu();
  if (a === "dish") return tmDish(+v);
  if (a === "back:" + v) return tmDish(+v);
  if (a.startsWith("back:")) return tmDish(+a.slice(5));
  if (a === "grams") { const [i, g] = v.split(":").map(Number); return tmRecipe(i, g); }
  if (a === "dec" || a === "inc" || a === "set") { freeMin = a === "set" ? +v : Math.max(1, Math.min(180, freeMin + (a === "inc" ? 1 : -1))); $("#fm").textContent = `${freeMin} min`; return; }
  if (a === "free") return tmStart(`Minutnik ${freeMin} min`, [{ name: "Odliczanie", min: freeMin }]);
  if (a === "start") { const [i, g] = v.split(":").map(Number), d = DISHES[i];
    return tmStart(`${d.name}, ${g} g`, [{ name: "Gotowanie na gazie", min: d.cook[g], done: "Wyłącz gaz! Zostaw pod pokrywką.", go: "Gaz wyłączony: start odpoczynku" },
      { name: "Odpoczynek pod pokrywką", min: d.rest }]); }
  if (a === "next") { stopRing(); T.i++; T.end = Date.now() + T.stages[T.i].min * 60e3; return tmRun(); }
  if (a === "plus") { T.end += 60e3; return tmUpdate(); }
  if (a === "cancel" || a === "done") { stopRing(); T = null; tmClose(); return tmUpdate(); }
}
$("#tbtn").onclick = () => { if (T && T.ringing && !$(".tm")) return tmRun(); tmMenu(); };
setInterval(tmUpdate, 250);

tick(); setInterval(tick, 1000);
loadBoard(); setInterval(loadBoard, 5 * 60e3);
loadWeather(); setInterval(loadWeather, 15 * 60e3);
loadWarnings(); setInterval(loadWarnings, 30 * 60e3);
</script>
